<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UniStore</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>UniStore</h1>
        <p class="muted">InterSwitch Web Checkout workshop demo (sandbox)</p>
      </header>

      <section class="card" id="product">
        <h2 id="product-name">Loading product…</h2>
        <p id="product-description" class="muted"></p>
        <p class="price" id="product-price"></p>
      </section>

      <form class="card" id="checkout-form">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@uniuyo.edu.ng" />
        <button id="pay-button" type="submit" disabled>Pay with InterSwitch</button>
      </form>

      <section class="card status" id="status" hidden>
        <p id="status-title"></p>
        <p id="status-detail" class="muted"></p>
        <p class="mono" id="status-reference"></p>
        <button id="recheck-button" type="button" hidden>Check payment status again</button>
      </section>
    </main>
    <script src="/checkout.js" type="module"></script>
  </body>
</html>
